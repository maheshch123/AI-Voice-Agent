[project]
name = "vani-voice-agent"
version = "0.1.0"
description = "Telugu & English AI voice agent: text-to-speech, sound effects and conversation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "numpy>=1.26", "edge-tts>=7.0", "httpx>=0.27", "anthropic>=2.5"]

[project.scripts]
vani = "voice_agent.cli:main"

[tool.setuptools]
packages = ["voice_agent", "voice_agent.tts", "voice_agent.sfx"]

[tool.setuptools.package-data]
voice_agent = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
